CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_SLEEP=n

CONFIG_ZMK_KEYBOARD_NAME="TOTEM"
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y

# +8 dBm TX on the central only. This is a controller-wide setting, so on a
# battery half it raises the cost of every transmission; the dongle is USB
# powered, so here it is free. It is also the only lever on the dongle->half
# direction, which the halves' own TX power cannot affect.
#
# Measured with nRF Connect, phone at each half, dongle at each candidate spot
# (dongle at +8 dBm, worst observed fade):
#   monitor stand: left -68 dBm, right -67 dBm
#   under table:   left -52 dBm, right -66 dBm
# Under-table was chosen. Allowing 8 dB for the halves dropping to 0 dBm and
# ~5 dB for the XIAO chip antenna vs the phone, that estimates to -65 dBm
# (left) and -79 dBm (right) at the dongle -- 30 dB and 16 dB above the
# nRF52840's -95 dBm sensitivity. The right half is the limiting link.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery reporting is disabled for all three boards in config/totem.conf.

