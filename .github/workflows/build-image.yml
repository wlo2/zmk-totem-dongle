name: Build and Push Prebaked image

# Rebuilding moves every later build to the current ZMK main. settings_reset
# is built by build.yml with the keyboards, so it no longer needs this.
on:
  workflow_dispatch:

# Deliberately WITHOUT cancel-in-progress. This workflow pushes
# ghcr.io/<owner>/zmk-zephyr:latest, which every other workflow uses as its
# build container -- cancelling mid-push can leave a broken manifest on :latest
# and break all builds. Grouping still prevents two dispatches racing the same
# tag; a second run queues behind the first instead.
concurrency:
  group: ${{ github.workflow }}

jobs:
  build-image:
    name: Build and push prebaked Zephyr image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zmk-zephyr
          # The dated tag keeps every image addressable, so a rebuild that
          # breaks the firmware build can be rolled back in build.yml.
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmm' tz='Europe/Sofia'}}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/workflows/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
