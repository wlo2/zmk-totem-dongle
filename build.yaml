# xiao_ble//zmk is ZMK's tuned variant; plain xiao_ble is the stock Zephyr
# board without ZMK's settings storage, UF2 output or bootloader retention.
include:
  - board: xiao_ble//zmk
    shield: totem_left
    artifact-name: totem_left
  - board: xiao_ble//zmk
    shield: totem_right
    artifact-name: totem_right
  - board: xiao_ble//zmk
    shield: totem_dongle
    artifact-name: totem_dongle
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset
